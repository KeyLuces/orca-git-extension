.pipe-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 6px; }
.pipe-row:hover { background: var(--sel); }
.pipe-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pipe-title { display: flex; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe-title .dim { overflow: hidden; text-overflow: ellipsis; }
.pipe-meta { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipe-stages { display: flex; gap: 12px; padding: 12px; overflow-x: auto; align-items: flex-start; }
.pipe-stage { flex: 0 0 220px; display: flex; flex-direction: column; gap: 4px; }
.pipe-stage .section-head { padding: 0 2px 4px; }
.pipe-job { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.pipe-job:hover, .pipe-job:focus-visible { border-color: var(--line-hi); background: var(--card-hi); }
.pipe-job.s-failed { border-color: color-mix(in srgb, var(--del) 45%, var(--line)); }
.pipe-job-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipe-dot { width: 20px; height: 20px; padding: 0; justify-content: center; cursor: default; flex: none; }
.pipe-log { flex: 1; overflow: auto; font: 12px/1.55 var(--mono); padding: 8px 0 16px; background: var(--bg); }
.pl { display: flex; min-width: max-content; }
.pl-n { position: sticky; left: 0; width: 52px; flex: none; padding-right: 12px; text-align: right; color: var(--t3); user-select: none; background: var(--bg); }
.pl-t { white-space: pre; padding-right: 16px; }
.pl.bad { background: color-mix(in srgb, var(--del) 12%, transparent); }
.pl.bad .pl-n { background: color-mix(in srgb, var(--del) 18%, var(--bg)); color: var(--del); }
.pipe-note { padding: 8px 12px; font-size: 12px; }
@media (max-width: 820px) { .pipe-stages { flex-direction: column; } .pipe-stage { flex: none; width: 100%; } }

/* AI at work: a skeleton over the box it fills, and a live status line */
.ai-wrap { position: relative; }
.ai-wrap > textarea, .ai-wrap > input { width: 100%; }
.ai-skel { position: absolute; inset: 1px; display: none; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius); background: var(--input, var(--bg)); pointer-events: none; overflow: hidden; }
.ai-wrap:has(> .generating) .ai-skel { display: flex; }
.ai-wrap:has(> input.generating) .ai-skel { padding: 8px 12px; }
.ai-wrap:has(> input.generating) .ai-skel span:nth-child(n + 2) { display: none; }
.ai-skel span { height: 9px; border-radius: 5px; background: linear-gradient(90deg, var(--card) 25%, color-mix(in srgb, var(--ren) 22%, var(--card-hi)) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.ai-skel span:nth-child(1) { width: 72%; }
.ai-skel span:nth-child(2) { width: 90%; animation-delay: .1s; }
.ai-skel span:nth-child(3) { width: 58%; animation-delay: .2s; }
.ai-skel span:nth-child(4) { width: 84%; animation-delay: .3s; }
.ai-skel span:nth-child(5) { width: 40%; animation-delay: .4s; }
.ai-status.working { display: flex; align-items: center; gap: 8px; color: var(--fg); }
.ai-secs { margin-left: auto; color: var(--t2); font-size: 12px; }
.ai-dots { display: inline-flex; gap: 3px; flex: none; }
.ai-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ren); animation: aiDot 1s ease-in-out infinite; }
.ai-dots i:nth-child(2) { animation-delay: .15s; }
.ai-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes aiDot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .ai-skel span, .ai-dots i { animation: none; } }

/* Pipelines: room around everything */
.pipes .history-bar { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pipe-list { padding: 8px 12px 16px; }
.pipe-stages { padding: 16px; gap: 16px; }
.pipes > .empty { padding: 40px 24px; }
.pipe-log { padding: 8px 4px 20px; }
.pipe-note { padding: 8px 16px; }

/* Identity profiles */
.idp-section { padding: 0 0 4px; }
.idp-now { padding: 2px 16px 12px; font-size: 12px; line-height: 1.6; }
.idp-now b { color: var(--fg); font-weight: 600; }
.idp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 0 16px 8px; }
.idp { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); }
.idp.on { border-color: color-mix(in srgb, var(--add) 55%, var(--line)); }
.idp-av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: color-mix(in srgb, var(--ren) 25%, var(--card-hi)); }
.idp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.idp-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.idp-mail { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idp-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pill.idp-global { background: color-mix(in srgb, var(--ren) 18%, transparent); color: var(--ren); }
.pill.idp-local { background: color-mix(in srgb, var(--mod) 18%, transparent); color: var(--mod); }
.pill.idp-use { display: inline-flex; gap: 3px; align-items: center; background: color-mix(in srgb, var(--add) 18%, transparent); color: var(--add); }
.idp-empty { padding: 4px 16px 12px; font-size: 12px; }
@media (max-width: 620px) { .idp { flex-wrap: wrap; } .idp-actions { width: 100%; justify-content: flex-start; } }
/* MR people: both columns line up (labels same height, boxes same height) */
.mr-people { align-items: start; }
.mr-people .field > label { min-height: 18px; display: flex; align-items: center; }
.mr-people .pp-box { min-height: 36px; }
.mr-people .pp-chip { height: 24px; }
.mr-route .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.mr-people .field > label { height: 20px; min-height: 0; line-height: 20px; }
.mr-people .link-btn { line-height: 20px; }
.pp-me.hidden { display: inline !important; visibility: hidden; }
.segmented button { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- phone polish ---------- */
@media (max-width: 820px) {
  /* header: the toolbar uses the whole width, buttons share it evenly */
  .repo-line .toolbar { margin-left: -46px; width: calc(100% + 46px); flex-basis: calc(100% + 46px); display: flex; gap: 8px; }
  .repo-line .toolbar > button { flex: 1 1 0; min-width: 0; justify-content: center; height: 40px; }
  .repo-line .toolbar > .sep, .repo-line .toolbar > .tb-sep { display: none; }
  #branchLine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* tabs scroll sideways; a fade on the right says there is more */
  nav.tabs { overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); scroll-padding: 0 28px; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs .tab { flex: none; min-height: 38px; }
  /* finger-sized controls */
  .segmented button { min-height: 36px; padding: 0 16px; }
  .btn.sm, .icon-btn { min-height: 36px; min-width: 36px; }
  .history-bar { gap: 8px; padding: 12px; }
  .history-bar .segmented { flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
  /* same side margins on every tab */
  .commit-box { margin: 0; padding: 12px 12px; }
  .view > .section-head, .changes-list .section-head { padding-left: 12px; padding-right: 12px; }
  /* Review & MR: actions wrap under the title as full-width rows */
  .review-actions { display: flex; gap: 4px; width: auto; }
  .review-actions .btn { justify-content: center; }
  /* pipelines and MR dialog */
  .mr-people { grid-template-columns: 1fr; }
  .pipes .history-bar { padding: 12px; }
  .pipe-row { padding: 12px 8px; }
  .idp-list { grid-template-columns: 1fr; padding: 0 12px 8px; }
}
/* skeleton rows had no width, so the loading state looked blank */
.skeleton-row .bar { flex: 1; }
.skeleton-list .skeleton-row:nth-child(2) .bar { flex: 0 1 70%; }
.skeleton-list .skeleton-row:nth-child(3) .bar { flex: 0 1 50%; }
@media (max-width: 820px) { .history-bar select, .mode-select { min-height: 36px; } }
@media (max-width: 820px) { select.mode-select, .history-bar select.mode-select { height: 36px; } }
/* the skeleton rows start see-through for their fade-in; make sure they end visible */
.skeleton-list .skeleton-row { opacity: 1; animation: skelIn .3s ease-out; }
@keyframes skelIn { from { opacity: 0; } to { opacity: 1; } }
/* segmented switches never wrap their words; on a phone they scroll sideways instead */
.segmented button { white-space: nowrap; flex: none; }
@media (max-width: 820px) { .segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; } .segmented::-webkit-scrollbar { display: none; } }

/* search: matches highlighted in the rows */
mark.hit { background: color-mix(in srgb, var(--mod) 38%, transparent); color: var(--fg); border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--mod) 30%, transparent); }
.match-note { flex: none; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 17px; color: var(--t2); background: var(--card-hi); }
.graph-search::-webkit-search-cancel-button { cursor: pointer; }
.history-bar .graph-search { flex: 1 1 240px; min-width: 0; }
.update-bar { position: sticky; top: 0; z-index: var(--z-toast, 60); display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: color-mix(in srgb, var(--ren) 18%, var(--raised)); border-bottom: 1px solid color-mix(in srgb, var(--ren) 40%, var(--line)); font-size: 13px; }

/* sheets live beside the scrolling area: they stay whole while the list scrolls */
.sheet-host { position: relative; }
.sheet-host > .sheet { bottom: 0; }
.sheet-grip { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; }
.sheet-grip:hover, .sheet-grip:active { background: color-mix(in srgb, var(--ren) 45%, transparent); }
@media (max-width: 820px) { .sheet-grip { display: none; } .sheet-host > .sheet { width: 100% !important; } }

/* ---------- toolbar on the right: where you are on the left, what you can do on the right ---------- */
@media (min-width: 821px) {
  body.wide .repo-line { display: contents; }
  body.wide header .toolbar { order: 3; margin-left: auto; }
  body.wide #branchLine { order: 2; }
}
.tb-sep { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--line); }
.tb-count { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--ren); color: var(--ref-head-ink, #10131a); font-size: 11px; font-weight: 600; line-height: 1; }
.toolbar .icon-btn.tb-hot { border-color: color-mix(in srgb, var(--ren) 55%, var(--line)); background: color-mix(in srgb, var(--ren) 14%, var(--card)); color: var(--t1); }
.icon-btn.tb-hot:not(.toolbar *) { color: var(--ren); }

/* ---------- graph rows: density, keyboard selection, quick actions ---------- */
.commit-row { height: var(--row-h, 28px); contain-intrinsic-size: auto var(--row-h, 28px); position: relative; }
.commit-row.kbd { box-shadow: inset 2px 0 0 var(--ren); background: var(--hover); }
.row-actions { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; padding: 0 4px 0 20px; background: linear-gradient(90deg, transparent, var(--row-bg, var(--bg)) 16px); }
.commit-row:hover .row-actions, .commit-row.kbd .row-actions { display: flex; }
.commit-row:hover, .commit-row.kbd { --row-bg: color-mix(in srgb, var(--fg) 5%, var(--bg)); }
.commit-row.selected { --row-bg: color-mix(in srgb, var(--ren) 14%, var(--bg)); }
.ra-btn { width: 24px; height: 22px; padding: 0; border-radius: 6px; background: var(--card); border: 1px solid var(--line); color: var(--t2); }
.ra-btn:hover { color: var(--t1); border-color: var(--line-hi); background: var(--card-hi); }
@media (hover: none) { .row-actions { display: none !important; } }
.density-btn.on { color: var(--ren); border-color: color-mix(in srgb, var(--ren) 45%, var(--line)); }
.history-bar .density-btn { height: 28px; width: 30px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; }

/* the day of the rows at the top, pinned while the list scrolls */
.date-float-wrap { position: sticky; top: 4px; height: 0; z-index: 4; display: flex; justify-content: center; pointer-events: none; }
.date-float { margin-top: 2px; padding: 3px 12px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--t1); font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; }
.date-float.on { opacity: 1; transform: none; }

/* ---------- split view: docked details beside the graph ---------- */
.sheet-host.docked > #main { margin-right: var(--dock-w, 0px); }
.sheet.dock { box-shadow: none; animation: none; }
.sheet.dock .sheet-body > div:not(.inline-skeleton) { padding-bottom: 12px; }

/* ---------- empty states say what to do next ---------- */
.empty-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---------- command palette ---------- */
.pal-overlay { align-items: flex-start; padding-top: 12vh; }
.palette { width: min(560px, calc(100vw - 32px)); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line-hi); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.pal-input { border: 0 !important; border-bottom: 1px solid var(--line) !important; border-radius: 0 !important; padding: 16px 16px !important; font-size: 14px; background: transparent !important; box-shadow: none !important; }
.pal-list { max-height: min(50vh, 380px); overflow: auto; padding: 8px; }
.pal-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--t1); text-align: left; font: inherit; cursor: pointer; }
.pal-item svg { color: var(--t2); }
.pal-item.on { background: var(--sel); }
.pal-item.on svg { color: var(--ren); }
.pal-none { padding: 16px; color: var(--t2); text-align: center; }
.pal-foot { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--t3); font-size: 11px; }
.kbd-help { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin: 12px 0 4px; }
.kbd-help kbd { justify-self: start; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-hi); border-bottom-width: 2px; background: var(--card); font: 11.5px var(--mono, ui-monospace, monospace); color: var(--t1); }
/* docked: the message gets the room; the date moves into the row's tooltip and the pane */
.sheet-host.docked .col-date { display: none; }
.sheet-host.docked .col-author { width: 110px; }

/* ---------- labels never run under the message or the next column ---------- */
.commit-text { overflow: hidden; }
.commit-subject { overflow: hidden; }
.commit-subject > .ref { flex: 0 1 auto; min-width: 34px; }
.commit-subject > .ref:first-child { flex-shrink: 0.4; }
.commit-subject .s { flex: 1 1 60px; min-width: 40px; }

/* ---------- sheet head: Back (when stacked) and Close ---------- */
.sheet-head { gap: 8px; padding: 8px 8px 8px 12px; min-height: 44px; }
.sheet-back { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 28px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--t1); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.sheet-back:hover { background: var(--card-hi); border-color: var(--line-hi); }
.sheet-back svg { color: var(--t2); }
.sheet-close { width: 30px; height: 30px; flex: none; justify-content: center; border-radius: 8px; color: var(--t2); }
.sheet-close:hover { background: color-mix(in srgb, var(--del) 16%, var(--card)); color: var(--t1); }
.sheet-close svg { width: 16px; height: 16px; }

/* ---------- toolbar buttons show the work: spinning or moving while it runs, a tick when done ---------- */
.toolbar .icon-btn.working { border-color: color-mix(in srgb, var(--ren) 60%, var(--line)); color: var(--t1); }
.toolbar .icon-btn.working svg { animation: tbSpin .8s linear infinite; }
.toolbar .icon-btn.working[data-op="pull"] svg, .toolbar .icon-btn.working[data-op="fetch"] svg { animation: tbDown .7s ease-in-out infinite; }
.toolbar .icon-btn.working[data-op="push"] svg { animation: tbUp .7s ease-in-out infinite; }
.toolbar .icon-btn.working[data-op="stash"] svg, .toolbar .icon-btn.working[data-op="undo"] svg { animation: tbPulse .8s ease-in-out infinite; }
.toolbar .icon-btn.working::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--ren), transparent); background-size: 200% 100%; animation: tbBar 1s linear infinite; }
.toolbar .icon-btn { position: relative; }
.toolbar .icon-btn.done { border-color: color-mix(in srgb, var(--add) 65%, var(--line)); background: color-mix(in srgb, var(--add) 14%, var(--card)); transition: background-color .4s, border-color .4s; }
.toolbar .icon-btn.done svg { color: var(--add); animation: tbPop .35s var(--ease); }
@keyframes tbSpin { to { transform: rotate(360deg); } }
@keyframes tbDown { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(2px); } }
@keyframes tbUp { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-2px); } }
@keyframes tbPulse { 50% { transform: scale(.82); opacity: .6; } }
@keyframes tbBar { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes tbPop { 0% { transform: scale(.6); } 70% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { .toolbar .icon-btn.working svg, .toolbar .icon-btn.done svg, .toolbar .icon-btn.working::after { animation: none; } }

/* ---------- pipelines: breadcrumbs, what failed, error stepping, find, wrap ---------- */
.pipe-crumbs { gap: 8px; }
.pipe-crumbs > svg, .pipe-crumbs > span > svg { color: var(--t3); }
.crumb { border: 0; background: none; padding: 3px 8px; border-radius: 6px; color: var(--ren); font: inherit; font-weight: 600; cursor: pointer; }
.crumb:hover { background: var(--hover); text-decoration: underline; }
.pipe-failed { display: flex; align-items: center; gap: 12px; margin: 12px 16px 4px; padding: 12px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--del) 45%, var(--line)); background: color-mix(in srgb, var(--del) 10%, var(--card)); }
.pipe-failed > span:first-child { color: var(--del); }
.pipe-logbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--raised); position: sticky; top: 0; z-index: 2; }
.pl-errnav { display: flex; align-items: center; gap: 8px; color: var(--del); }
.pl-errnav.ok { color: var(--add); }
.pl-errnav b { color: var(--t1); margin-right: 2px; }
.pl-errnav .icon-btn { width: 26px; height: 24px; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.pl-errnav .check { margin-left: 8px; color: var(--t2); }
.pl-counter { min-width: 44px; text-align: center; }
.pl-find { width: 200px; height: 28px; }
.pl-live { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ren) 16%, transparent); color: var(--ren); font-size: 11px; font-weight: 600;  }
.pl-live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: tbPulse 1.2s ease-in-out infinite; }
.pipe-log.wrap .pl { min-width: 0; }
.pipe-log.wrap .pl-t { white-space: pre-wrap; word-break: break-word; }
.pipe-log.only-bad .pl:not(.bad) { display: none; }
.pl.hit { background: color-mix(in srgb, var(--mod) 18%, transparent); }
.pl.cur { box-shadow: inset 3px 0 0 var(--del); background: color-mix(in srgb, var(--del) 22%, transparent); }
.pl.hit.cur { box-shadow: inset 3px 0 0 var(--mod); }
@media (max-width: 820px) { .pl-find { width: 100%; order: 5; } .pipe-failed { margin: 12px; } }
.pipe-logbar .pl-find { width: 220px !important; flex: none; }
.history-bar .graph-search { min-width: 0; flex: 1 1 140px; }
.sheet-host.docked .history-bar { flex-wrap: wrap; }
@media (max-width: 820px) { .pipe-logbar .pl-find { width: 100% !important; } }
/* the branch sits right after the repository name: one "where you are" group */
@media (min-width: 821px) { body.wide .repo-line > .repo-btn.grow { flex: 0 1 auto; } body.wide header { gap: 8px; } }


/* =========================================================================
   unslop polish (unslop by Damir Sokolovsky, @heydamir, CC BY 4.0)
   Direction: exact, quiet, quick. A night transit map: the graph lines and branch labels carry the
   color; the chrome stays grey with one blue accent. Signature: a branch keeps its lane color everywhere.
   ========================================================================= */
/* section labels: sentence case, muted, a little closer to their own items */
.side-head, .section-head, .cfg-group, .menu .label, .res-label { font-size: 12px; font-weight: 500; color: var(--t3); }
.side-head { padding: 12px 12px 4px; }
.section-head { padding: 16px 16px 8px; }
#side .item { min-height: 32px; }

/* counts are quiet mono text, not bubbles */
.tab .badge, .section-head .count, .side-head .count { background: none !important; border: 0 !important; padding: 0 0 0 4px !important; min-width: 0 !important; color: var(--t3) !important; font: 500 12px/1 var(--mono, ui-monospace, monospace) !important; font-variant-numeric: tabular-nums; }
.tab.active .badge { color: var(--t2) !important; }
.tb-count { background: none; color: var(--ren); padding: 0 0 0 2px; min-width: 0; height: auto; font: 600 12px/1 var(--mono, ui-monospace, monospace); font-variant-numeric: tabular-nums; }
.toolbar .icon-btn.tb-hot { background: var(--card); border-color: color-mix(in srgb, var(--ren) 45%, var(--line)); }

/* status chips: neutral text tags; the lane colors stay with branches */
.pill.role { background: var(--raised) !important; color: var(--t2) !important; border: 1px solid var(--line) !important; border-radius: 4px !important; font-weight: 500 !important; }
.menu-badge { display: none; }

/* one accent action per screen: row actions in lists are secondary */
.review-actions .btn.primary { background: var(--card); color: var(--t1); border-color: var(--line); }

/* radius by size, not pills everywhere */
.branch-chip { border-radius: 8px; }
.ci { border-radius: 6px; }
.date-float { border-radius: 6px; }
.pl-live { border-radius: 4px; }
.ai-title { gap: 0; }

/* toasts: at most three on screen, the newest last */
#toasts > .toast:nth-last-child(n + 4) { display: none; }

/* motion: a colour change, no overshoot */
.toolbar .icon-btn.done svg { animation: none; }
.toolbar .icon-btn.working[data-op="pull"] svg, .toolbar .icon-btn.working[data-op="fetch"] svg, .toolbar .icon-btn.working[data-op="push"] svg { animation-duration: .9s; }
@keyframes tbDown { 0%, 100% { transform: translateY(-1.5px); } 50% { transform: translateY(1.5px); } }
@keyframes tbUp { 0%, 100% { transform: translateY(1.5px); } 50% { transform: translateY(-1.5px); } }

/* MR dialog: the people hint is one line of text, not three columns */
.pp-note { display: block !important; font-size: 12px; line-height: 16px; margin-bottom: 8px; }
.tab .badge { display: inline-flex; align-items: center; height: auto !important; line-height: inherit !important; vertical-align: baseline; }

/* ---------- tooltip: our own, in the theme, instead of the browser's ---------- */
.tip { position: fixed; z-index: 10000; max-width: min(360px, calc(100vw - 12px)); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line-hi); background: var(--raised); color: var(--t1); box-shadow: var(--shadow); font-size: 12px; line-height: 16px; white-space: pre-line; overflow-wrap: anywhere; pointer-events: none; opacity: 0; transform: translateY(-2px); transition: opacity .12s cubic-bezier(.22, 1, .36, 1), transform .12s cubic-bezier(.22, 1, .36, 1); }
.tip[data-side="above"] { transform: translateY(2px); }
.tip.on { opacity: 1; transform: none; }
html.light .tip { background: #fff; }
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }

/* ahead/behind: to push green, to pull amber, gone separate ways red */
.sync-ab { display: inline-flex; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.ab-up { color: var(--add); }
.ab-down { color: var(--mod); }
.tb-count.ab-up { color: var(--add); }
.tb-count.ab-down { color: var(--mod); }
.sync-ab.diverged .ab-up, .sync-ab.diverged .ab-down, .toolbar .icon-btn.diverged .tb-count { color: var(--del); }
.toolbar .icon-btn.tb-hot { border-color: var(--line-hi); }
.toolbar .icon-btn.tb-hot.diverged { border-color: color-mix(in srgb, var(--del) 50%, var(--line)); }

/* ---------- merge request list: a row opens its detail page ---------- */
.review-row { cursor: pointer; }
.review-row:hover { background: var(--hover); }
.review-row:focus-visible { outline: 2px solid var(--ren); outline-offset: -2px; }
.review-actions { display: flex; align-items: center; gap: 4px; }
.review-chev { color: var(--t3); display: inline-flex; }
.review-row:hover .review-chev { color: var(--t2); }

/* ---------- merge request detail ---------- */
.sheet.mr-detail { width: min(1080px, 86%); }
.mrd { display: flex; flex-direction: column; min-height: 100%; }
.mrd-head { padding: 20px 24px 12px; }
.mrd-title { margin: 0 0 8px; font-size: 16px; font-weight: 600; line-height: 24px; color: var(--t1); }
.mrd-ref { color: var(--t3); font-weight: 400; }
.mrd-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 12px; }
.mrd-state { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-weight: 600; border: 1px solid var(--line); background: var(--raised); color: var(--t1); }
.mrd-state.s-open { border-color: color-mix(in srgb, var(--add) 50%, var(--line)); color: var(--add); }
.mrd-state.s-merged { border-color: color-mix(in srgb, #b48be8 50%, var(--line)); color: #b48be8; }
.mrd-state.s-closed { border-color: color-mix(in srgb, var(--del) 50%, var(--line)); color: var(--del); }
.mrd-route { display: inline-flex; align-items: center; gap: 4px; color: var(--t3); }
.mrd-tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--bg); }
.mrd-tab { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--t2); font: inherit; font-size: 13px; cursor: pointer; }
.mrd-tab:hover { color: var(--t1); }
.mrd-tab.on { color: var(--t1); border-bottom-color: var(--ren); font-weight: 500; }
.mrd-count { color: var(--t3); font-size: 12px; }
.mrd-pane { flex: 1; }
.mrd-overview { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; padding: 20px 24px 24px; }
.mrd-desc { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.mrd-sec { padding: 16px 0 8px !important; }
.mrd-thread { display: flex; flex-direction: column; gap: 12px; }
.mrd-comment { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.mrd-comment.k-approved { border-color: color-mix(in srgb, var(--add) 35%, var(--line)); }
.mrd-comment.k-changes { border-color: color-mix(in srgb, var(--del) 35%, var(--line)); }
.mrd-c-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; font-size: 12px; }
.mrd-c-file { padding: 0 6px; border-radius: 4px; background: var(--raised); }
.mrd-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.mrd-tag.ok { color: var(--add); }
.mrd-tag.bad { color: var(--del); }
.mrd-none { padding: 4px 0; }
.mrd-avatar { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--raised); border: 1px solid var(--line); color: var(--t2); font-size: 11px; font-weight: 600; }
.mrd-side { display: flex; flex-direction: column; gap: 16px; }
.mrd-box { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.mrd-box:last-child { border-bottom: 0; }
.mrd-label { font-size: 12px; color: var(--t3); }
.mrd-big { font-size: 14px; font-weight: 500; color: var(--t1); }
.mrd-person { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.mrd-rs { display: inline-flex; color: var(--t3); }
.mrd-rs.ok { color: var(--add); }
.mrd-rs.bad { color: var(--del); }
.mrd-labels { display: flex; flex-wrap: wrap; gap: 4px; }
.mrd-commits { display: flex; flex-direction: column; padding: 8px 12px 24px; }
.mrd-commit { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--t1); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.mrd-commit:hover { background: var(--hover); }
.mrd-when { width: 72px; text-align: right; }
.mrd-bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--raised); margin-top: auto; }
/* markdown */
.md { font-size: 13px; line-height: 20px; color: var(--t1); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; }
.md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; font-size: 14px; font-weight: 600; }
.md h3 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md code { padding: 1px 4px; border-radius: 4px; background: var(--raised); font: 12px var(--mono, ui-monospace, monospace); }
.md pre { margin: 0 0 8px; padding: 12px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); overflow: auto; }
.md pre code { padding: 0; background: none; }
.md blockquote { margin: 0 0 8px; padding: 0 12px; border-left: 2px solid var(--line-hi); color: var(--t2); }
.md a { color: var(--ren); text-decoration: none; }
.md a:hover { text-decoration: underline; }
@media (max-width: 820px) {
  .sheet.mr-detail { width: 100%; }
  .mrd-overview { grid-template-columns: 1fr; padding: 16px; }
  .mrd-head, .mrd-tabs, .mrd-bar { padding-left: 16px; padding-right: 16px; }
  .mrd-bar { flex-wrap: wrap; }
  .mrd-bar > .grow { flex-basis: 100%; }
}
/* toasts sit above the decision bar of a detail page */
body:has(.mrd-bar) #toasts { bottom: 72px; }

/* merge request detail: long names wrap inside their card; narrow pages stack the side facts on top */
.mrd-c-head b, .mrd-person .grow { min-width: 0; overflow-wrap: anywhere; }
.mrd-comment > .grow { min-width: 0; }
.mrd-comment .md { overflow-wrap: anywhere; }
@container (max-width: 820px) {
  .mrd-overview { grid-template-columns: 1fr; gap: 16px; }
  .mrd-side { order: -1; flex-direction: row; flex-wrap: wrap; gap: 12px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .mrd-box { padding-bottom: 0; border-bottom: 0; min-width: 140px; }
  .mrd-bar > .grow { display: none; }
  .mrd-bar { justify-content: flex-end; }
}

/* AI commit: Generate sits on the Message field it fills */
.ai-msg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ai-msg-head label { margin: 0; }
.ai-gen { min-width: 92px; justify-content: center; }

/* right-sidebar panel: no branches drawer button, so the toolbar starts at the edge */
.side-panel .repo-line .toolbar { margin-left: 0 !important; width: 100% !important; flex-basis: 100% !important; }
.side-panel .repo-line .toolbar > button { height: 32px; }
.side-panel header { padding: 8px 12px; }

/* tab counts: small flat tags, each colour says what it counts */
.tab .badge { display: inline-flex !important; align-items: center; justify-content: center; min-width: 18px !important; height: 18px !important; padding: 0 5px !important; margin-left: 6px; border-radius: 4px !important; border: 0 !important; font: 600 11px/18px var(--mono, ui-monospace, monospace) !important; font-variant-numeric: tabular-nums; background: var(--raised) !important; color: var(--t2) !important; }
.tab .badge.tb-changes { background: color-mix(in srgb, var(--mod) 18%, transparent) !important; color: var(--mod) !important; }
.tab .badge.tb-reviews { background: color-mix(in srgb, var(--ren) 20%, transparent) !important; color: var(--ren) !important; }
.tab .badge.tb-stash { background: color-mix(in srgb, var(--fg) 10%, transparent) !important; color: var(--t2) !important; }

/* Generate: an outlined accent button with its own icon, so Commit stays the one solid action */
.btn.ai-gen { gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--ren) 55%, var(--line)); background: color-mix(in srgb, var(--ren) 10%, transparent); color: var(--ren); font-weight: 500; transition: background-color .15s, border-color .15s, color .15s; }
.btn.ai-gen:hover:not(:disabled) { background: color-mix(in srgb, var(--ren) 18%, transparent); border-color: var(--ren); color: var(--t1); }
.btn.ai-gen:focus-visible { outline: 2px solid color-mix(in srgb, var(--ren) 60%, transparent); outline-offset: 2px; }
.btn.ai-gen svg { color: currentColor; }
.btn.ai-gen.stop { border-color: color-mix(in srgb, var(--del) 55%, var(--line)); background: color-mix(in srgb, var(--del) 10%, transparent); color: var(--del); }

/* commit tab: a section head folds its list */
.fold-head { cursor: pointer; user-select: none; }
.fold-head:hover { color: var(--t1); }
.fold-head:focus-visible { outline: 2px solid var(--ren); outline-offset: -2px; }

/** fields: [{ key, label, value, placeholder, type: 'text'|'textarea'|'select'|'check', options: [[value,label]], hint }] */
function dialog({ title, message, fields = [], ok = 'OK', danger = false, cancel = 'Cancel', stack = false }) {
  if (stack) closeOverlays('.menu')
  else closeOverlays()
  return new Promise((resolve) => {
    const inputs = {}
    const form = h('form', { class: 'dialog', onSubmit: (e) => (e.preventDefault(), done(true)) })
    let closed = false
    const done = (okd) => {
      if (closed) return
      closed = true
      overlay.remove()
      document.removeEventListener('keydown', onKey)
      if (!okd) return resolve(null)
      const out = {}
      for (const [k, el] of Object.entries(inputs)) out[k] = el.type === 'checkbox' ? el.checked : el.value
      resolve(out)
    }
    const onKey = (e) => e.key === 'Escape' && isTopOverlay(overlay) && (e.preventDefault(), done(false))
    append(form, [h('h3', null, title), message && h('p', null, message)])
    for (const f of fields) {
      let el
      if (f.type === 'check') {
        el = h('input', { type: 'checkbox', checked: !!f.value })
        form.append(h('label', { class: 'check' }, el, f.label))
      } else {
        if (f.type === 'select')
          el = h('select', null, f.options.map(([v, l]) => h('option', { value: v, selected: v === f.value }, l)))
        else if (f.type === 'textarea') el = h('textarea', { placeholder: f.placeholder || '' }, f.value || '')
        else el = h('input', { type: 'text', value: f.value || '', placeholder: f.placeholder || '', spellcheck: 'false' })
        form.append(h('div', { class: 'field' }, h('label', null, f.label), el, f.hint && h('div', { class: 'hint' }, f.hint)))
      }
      inputs[f.key] = el
    }
    form.append(
      h(
        'div',
        { class: 'buttons' },
        cancel && h('button', { type: 'button', class: 'btn', onClick: () => done(false) }, cancel),
        h('button', { type: 'submit', class: `btn ${danger ? 'danger solid' : 'primary'}` }, ok)
      )
    )
    const overlay = h('div', { class: 'overlay', onMousedown: (e) => e.target === overlay && done(false) }, form)
    mountOverlay(overlay, () => done(false), stack)
    document.addEventListener('keydown', onKey)

}
/** Asked from inside an open modal, the confirm stacks over it: Cancel returns to the modal intact. */
const confirmBox = (title, message, ok = 'Confirm', danger = false) =>
  dialog({ title, message, ok, danger, stack: !!document.querySelector('.overlay') }).then((r) => r !== null)

/** A right-click opens the row's menu at the pointer; `menu` reads it once. */
let menuPoint = null
/**
 * items: { label, icon, onClick, danger, disabled, hint, items } | '-' | { header }. anchor: an element
 * or { x, y }. An item with `items` is a cascading sub-menu: pointing at it opens the next level
 * beside it (Enter or → from the keyboard), and choosing anything closes every level.
 */
function menu(anchor, items, parent = null) {
  if (!parent) closeOverlays('.menu') // a menu may open from inside a dialog: leave dialogs alone
  const el = h('div', { class: 'menu', role: 'menu' })
  el.closeAll = () => {
    let root = el
    while (root.parentMenu) root = root.parentMenu
    root.closeChild?.()
    root.remove()
    root.cleanup?.()
  }
  if (!parent) el.dispose = () => el.closeAll()
  el.parentMenu = parent
  el.closeChild = () => {
    el.child?.closeChild?.()
    el.child?.remove()
    el.child = null
    el.querySelectorAll('button.open').forEach((b) => b.classList.remove('open'))
  }
  let hoverTimer = 0
  const openSub = (btn, it) => {
    if (el.child?.owner === btn) return
    el.closeChild()
    btn.classList.add('open')
    const r = btn.getBoundingClientRect()
    el.child = menu({ x: r.right - 2, y: r.top - 5, side: r.left + 2 }, it.items, el)
    el.child.owner = btn
  }
  for (const it of items) {
    if (!it) continue
    if (it === '-') el.append(h('hr'))
    else if (it.header) el.append(h('div', { class: 'label' }, it.header))
    else {
      const empty = it.items && !it.items.filter(Boolean).length
      const btn = h(
        'button',
        {
          class: [it.danger ? 'danger' : '', it.items ? 'has-sub' : '', it.cls || ''].join(' ').trim(),
          disabled: it.disabled || empty,
          'aria-haspopup': it.items ? 'menu' : null,
          onMouseenter: () => {
            clearTimeout(hoverTimer)
            // A short pause lets the pointer cross other items on its way to an open sub-menu.
            hoverTimer = setTimeout(() => (it.items ? openSub(btn, it) : el.closeChild()), it.items ? 80 : 160)
          },
          onKeydown: (e) => {
            if (it.items && e.key === 'ArrowRight') (e.preventDefault(), openSub(btn, it), el.child?.querySelector('button:not(:disabled)')?.focus())
            if (e.key === 'ArrowLeft' && parent) (e.preventDefault(), el.owner?.focus(), parent.closeChild())
          },
          onClick: () => {
            if (it.items) return openSub(btn, it)
            el.closeAll()
            it.onClick()
          }
        },
        it.icon ? icon(it.icon) : h('span', { style: { width: '14px' } }),
        h('span', { class: 'grow ellipsis', title: (it.full || it.label).replace(/…$/, '') }, it.label.replace(/…$/, '')),
        it.badge && h('span', { class: 'menu-badge' }, it.badge),
        it.hint && h('span', { class: 'dim', style: { fontSize: '11px' } }, it.hint),
        it.items && h('span', { class: 'dim sub-arrow', 'aria-hidden': 'true' }, '›')
      )
      el.append(btn)
    }
  }
  el.addEventListener('mouseenter', () => clearTimeout(hoverTimer))
  document.body.append(el)
  const point = menuPoint ?? (typeof anchor?.x === 'number' && !anchor.getBoundingClientRect ? anchor : null)
  menuPoint = null
  const mw = el.offsetWidth
  const mh = el.offsetHeight
  let left, top
  if (parent) {
    // Beside the item; to its left when there is no room on the right.
    left = point.x + mw > window.innerWidth - 8 ? Math.max(8, point.side - mw) : point.x
    top = Math.max(8, Math.min(point.y, window.innerHeight - mh - 8))
  } else {
    const r = point ? { left: point.x, right: point.x + mw, top: point.y, bottom: point.y } : anchor.getBoundingClientRect()
    left = Math.min(r.right - mw, window.innerWidth - mw - 8)
    if (left < 8) left = 8
    top = r.bottom + 4
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4)
  }
  el.style.left = left + 'px'
  el.style.top = top + 'px'
  if (!parent) {
    // One outside-click and one key listener for the whole cascade, removed when it closes.
    const off = (e) => {
      if (![...document.querySelectorAll('.menu')].some((m) => m.contains(e.target))) el.closeAll()
    }
    const onKey = (e) => {
      const menus = [...document.querySelectorAll('.menu')]
      if (e.key === 'Escape') {
        e.preventDefault()
        e.stopImmediatePropagation()
        const focusBack = el.anchorEl
        el.closeAll()
        focusBack?.focus?.()
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const cur = menus.find((m) => m.contains(document.activeElement)) || menus[menus.length - 1]
        const btns = [...cur.querySelectorAll(':scope > button:not(:disabled)')]
        if (!btns.length) return
        e.preventDefault()
        const i = btns.indexOf(document.activeElement)
        const next = e.key === 'ArrowDown' ? (i + 1) % btns.length : i <= 0 ? btns.length - 1 : i - 1
        btns[next].focus()
      }
    }
    const timer = setTimeout(() => document.addEventListener('mousedown', off, true))
    document.addEventListener('keydown', onKey, true)
    el.anchorEl = anchor instanceof Element ? anchor : null
    el.cleanup = () => {
      clearTimeout(timer)
      document.removeEventListener('mousedown', off, true)
      document.removeEventListener('keydown', onKey, true)
      el.cleanup = null
    }
  }
  return el
}

/* =========================================================================
   running git operations
   ========================================================================= */
function setBusy(delta) {
  state.busy += delta
  let bar = $('.loading')
  if (state.busy > 0 && !bar) $('#main').prepend(h('div', { class: 'loading' }))
  if (state.busy <= 0) bar?.remove()
}

/**
 * Open a web link outside Orca. Desktop: the worker hands it to the system default browser (no Orca
 * prompt, no in-app tab). Orca's web client (e.g. on a phone): a new tab of that browser.
 */
// Orca's plugin frames do not always say "Electron", so only a phone or tablet counts as the web client;
// everywhere else the worker opens the link on this computer.
const isDesktop = /Electron/i.test(navigator.userAgent) || !/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
async function openLink(url) {
  if (!/^https?:\/\//.test(String(url))) return
  if (isDesktop) {
    try {
      const r = await request('shell.open', { url }, 15000)
      if (r?.opened) return
    } catch {}
  }
  const w = window.open(url, '_blank', 'noopener')
  if (!w) {
    await copy(url)
    toast('The link was copied: paste it into your browser.')
  }
}
/** Run an op with a spinner and error toast, then refresh. Returns the result, or undefined on failure. */
async function run(op, args, { success, refresh = true, quiet = false } = {}) {
  setBusy(1)
  setWorking(op, true)
  // fetch, pull and push say what they changed once the view is fresh ("3 new commits", "up to date")
  const before = SYNC_NOTE[op] && state.status ? { oid: state.status.oid, ahead: state.status.ahead || 0, behind: state.status.behind || 0, upstream: state.status.upstream } : null
  let ok = false
  try {
    const out = await call(op, args)
    ok = true
    if (success && !before) toast(success)
    else if (!before && !quiet && typeof out === 'string' && out.trim() && NET_OPS.has(op)) toast(out.trim().split('\n').slice(-3).join('\n'))
    return out ?? ''
  } catch (e) {
    toast(e?.message || String(e), 'error')
    return undefined
  } finally {
    setBusy(-1)
    if (refresh) await refreshAll()
    setWorking(op, false, ok)
    if (ok && before) toast(SYNC_NOTE[op](before, state.status || {}, success, args || {}))
  }
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`
const SYNC_NOTE = {
  fetch: (b, a, done) => {
    const n = (a.behind || 0) - b.behind
    if (!a.upstream) return `${done || 'Fetched'} · this branch has no remote branch`
    if (n > 0) return `${done || 'Fetched'} · ${plural(n, 'new commit')} on ${a.upstream} to pull`
    if (a.behind) return `${done || 'Fetched'} · nothing new · ${plural(a.behind, 'commit')} still to pull`
    return `${done || 'Fetched'} · already up to date`
  },
  pull: (b, a, done) => (a.oid && a.oid !== b.oid ? `${done || 'Pulled'} · ${b.behind ? plural(b.behind, 'commit') + ' · ' : ''}now at ${a.oid.slice(0, 7)}` : 'Already up to date · nothing to pull'),
  push: (b, a, done, args) => (args.branch && args.branch !== a.branch ? done || 'Pushed' : b.ahead > 0 || !b.upstream ? `${done || 'Pushed'}${b.ahead ? ' · ' + plural(b.ahead, 'commit') : ''}` : `${done || 'Pushed'} · ${a.upstream || 'the remote'} was already up to date`)
}
/** Which toolbar buttons are busy (spinning) and which just finished (a short tick). */
const working = new Set()
const justDone = new Map()
const OP_BTN = { fetch: 'fetch', pull: 'pull', push: 'push', stashSave: 'stash', refresh: 'refresh', undoLast: 'undo' }
function setWorking(op, on, ok) {
  const key = OP_BTN[op]
  if (!key) return
  if (on) working.add(key)
  else {
    working.delete(key)
    if (ok) {
      justDone.set(key, Date.now())
      setTimeout(() => (justDone.delete(key), paintWorking()), 1300)
    }
  }
  paintWorking()
}
function paintWorking() {
  for (const b of document.querySelectorAll('#toolbar [data-op]')) {
    b.classList.toggle('working', working.has(b.dataset.op))
    b.classList.toggle('done', !working.has(b.dataset.op) && justDone.has(b.dataset.op))
  }
}

/* =========================================================================
   repository selection
   ========================================================================= */
async function resolveRepo() {
  if (IN_TAB && !docRepo) {
    // The tab's file names the repository it was opened from: a fallback when focus is unknown.
    try {
      const doc = await window.orca.document.get()
      docRepo = JSON.parse(doc.content.text || '{}').repo || null
    } catch {}
  }
  let res = { focused: null, workspaces: state.workspaces }
  // A tab whose file names its project (or that the person pointed elsewhere) has nothing to look up:
  // asking Orca which workspace is focused costs a process launch, so only follow focus otherwise.
  if (!(IN_TAB && (state.pinned || docRepo))) {
    try {
      res = await request('repo.resolve', {})
    } catch (e) {
      toast(e.message, 'error')
    }
    state.workspaces = res.workspaces || []
  }
  // A Git Control tab belongs to one project (its file lives there), so it shows that project.
  // The sidebar panel follows whatever is focused.
  const target = state.pinned || (IN_TAB ? docRepo || res.focused : res.focused)
  if (target !== state.repo) setRepo(target)
  // A Git Control tab file (untitled.gitgraph from the + menu) must never show up as a change.
  if (IN_TAB && target && !ignoredGraphIn.has(target)) {
    ignoredGraphIn.add(target)
    request('repo.ignoreGraphFiles', { repo: target }).catch(() => {})
  }
}

/** Point the view at another repository, showing its last snapshot right away when there is one. */
function setRepo(p) {
  // switching projects: the whole page shows a loading skeleton until the new repository answers
  // (its remembered tab, scroll and open commit still come back once it does)
  const switching = !!state.repo && !!p && p !== state.repo
  if (p !== state.repo) rowCache?.clear()
  state.repo = p
  state.loadingRepo = switching
  state.status = null
  state.refs = null
  resetHistory()
  state.history.open = null
  clearSheets()
  if (p) store.set('lastRepo', p)
  // come back where this repository was left: its tab, scroll position and open commit
  if (p) {
    const m = viewMem.get()
    if (m.tab && TABS.some(([id]) => id === m.tab)) state.tab = m.tab
    state.history.open = m.open || null
    viewRestore = m.scroll || m.open ? { ...m } : null
  }
  if (switching) return showLoadingSkeleton()
  const s = p && snap.load(p)
  if (s) {
    state.status = s.status
    state.refs = s.refs
    if (s.all === state.history.all && s.commits?.length && !state.history.search) {
      state.history.commits = s.commits
      state.history.stale = true
    }
  }
}

/** What each repository's view looked like when it was left (tab, scroll, open commit). */
let viewRestore = null
const viewMem = {
  key: () => 'view.' + String(state.repo || '').replace(/\\/g, '/').toLowerCase(),
  get() {
    const v = state.repo ? store.get(viewMem.key(), null) : null
    return v && typeof v === 'object' ? v : {}
  },
  set(patch) {
    if (state.repo) store.set(viewMem.key(), { ...viewMem.get(), ...patch })
  }
}
let scrollSaveTimer = null
document.addEventListener(
  'scroll',
  (e) => {
    if (e.target?.id !== 'main' || viewRestore) return
    clearTimeout(scrollSaveTimer)
    scrollSaveTimer = setTimeout(() => viewMem.set({ scroll: Math.round($('#main').scrollTop), scrollTab: state.tab }), 300)
  },
  true
)

/* Per-repository snapshot (status, refs, first page of history) so a view renders instantly. */
const snap = {
  key: (p) => 'gitx.snap.' + p.replace(/\\/g, '/').toLowerCase(),
  load(p) {
    try {
      return JSON.parse(localStorage.getItem(snap.key(p)) || 'null')
    } catch {
      return null
    }
  },
  save() {
    if (!state.repo || !state.status) return
    const H = state.history
    const prev = snap.load(state.repo) || {}
    const commits = !H.search && H.commits.length ? H.commits.slice(0, 150) : prev.all === H.all ? prev.commits : null
    try {
      localStorage.setItem(snap.key(state.repo), JSON.stringify({ status: state.status, refs: state.refs, all: H.all, commits }))
    } catch {}
  }
}

const sameRepoPath = (a, b) => a.replace(/\\/g, '/').toLowerCase() === b.replace(/\\/g, '/').toLowerCase()
/** Workspaces grouped by repository name, repositories A–Z, the main folder first in each. */
function repoGroups(ws) {
  const groups = new Map()
  for (const w of ws) {
    const name = w.repoName || basename(w.path)
    if (!groups.has(name)) groups.set(name, [])
    groups.get(name).push(w)
  }
  for (const list of groups.values()) list.sort((a, b) => (b.main ? 1 : 0) - (a.main ? 1 : 0) || String(a.branch).localeCompare(String(b.branch)))
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))
}
async function repoMenu(anchor) {
  if (!state.workspaces.length) state.workspaces = (await request('repo.resolve', {}).catch(() => null))?.workspaces || []
  const ws = state.workspaces.filter((w) => w.kind === 'worktree' || w.kind === 'folder')
  menu(anchor, [
    { header: 'Repository' },
    {
      label: 'Follow focused workspace',
      icon: state.pinned ? null : 'check',
      onClick: async () => {
        state.pinned = null
        store.set('pinnedRepo', null)
        await resolveRepo()
        refreshAll()
      }
    },
    '-',
    // grouped by repository (its worktrees under it), so many "dev" or "main" can be told apart
    ...repoGroups(ws).flatMap(([repoName, list]) => [
      { header: repoName },
      ...list.map((w) => ({
        label: w.branch || w.name,
        hint: list.length > 1 && w.main ? 'main folder' : '',
        icon: state.repo && sameRepoPath(state.repo, w.path) ? 'check' : w.kind === 'worktree' ? 'branch' : 'folder',
        onClick: () => pinRepo(w.path)
      }))
    ]),
    ws.length ? '-' : null,
    { label: 'Clone repository…', icon: 'download', onClick: cloneRepo },
    {
      label: 'Open path…',
      icon: 'folder',
      onClick: async () => {
        const r = await dialog({
          title: 'Open repository',
          fields: [{ key: 'path', label: 'Folder path', value: state.repo || '', placeholder: 'C:\\code\\my-repo' }],
          ok: 'Open'
        })
        if (!r?.path) return
        const chk = await request('repo.check', { path: r.path.trim() })
        if (chk.ok) pinRepo(chk.toplevel)
        else {
          const init = await confirmBox('Not a Git repository', `${r.path}\n\nInitialize a new repository here?`, 'git init')
          if (init) {
            await request('git', { op: 'init', args: { path: r.path.trim() } }).catch((e) => toast(e.message, 'error'))
            pinRepo(r.path.trim())
          }
        }
      }
    }
  ])
}
function pinRepo(p) {
  state.pinned = p
  if (!IN_TAB) store.set('pinnedRepo', p)
  setRepo(p)
  renderAll()
  refreshAll()
}

/* =========================================================================
   header
   ========================================================================= */
function renderHeader() {
  const st = state.status
  clear($('#repoIcon')).append(icon(state.pinned ? 'folder' : 'worktree', 14))
  $('#repoName').textContent = state.repo ? basename(st?.toplevel || state.repo) : 'No repository'
  $('#repoBtn').title = state.repo || 'Choose a repository'
  clear($('#repoCaret')).append(icon('down', 12))
  const side = $('#sideToggle')
  if (side && !side.querySelector('svg')) clear(side).append(icon('menu', 16))

  const tb = clear($('#toolbar'))
  const dis = !state.repo || !st
  // In the full tab the main actions carry a label, like a toolbar; in the narrow panel icons only.
  const lbl = (b, text) => (b.append(h('span', { class: 'tb-label' }, text)), b) // narrow screens hide it, except on a button with work waiting
  // Pull/Push carry how many commits wait (↓ to pull, ↑ to push) and stand out while any do.
  const diverged = st?.ahead > 0 && st?.behind > 0
  const counted = (b, n, title) => {
    if (n > 0) {
      const up = b.title === 'Push'
      b.append(h('span', { class: `tb-count ${up ? 'ab-up' : 'ab-down'}`, title: diverged ? `${title}. The branch and its remote have gone separate ways: pull before pushing` : title }, h('span', { class: 'tb-arrow' }, up ? '↑' : '↓'), String(n)))
      b.classList.add('tb-hot')
      if (diverged) b.classList.add('diverged')
    }
    return b
  }
  const st0 = st || {}
  const sep = () => IN_TAB && h('span', { class: 'tb-sep' })
  append(tb, [
    lbl(iconBtn('fetch', 'Fetch all (prune)', () => run('fetch', {}, { success: 'Fetched' }), { disabled: dis }), 'Fetch'),
    counted(lbl(iconBtn('pull', 'Pull', (e) => pullMenu(e.currentTarget), { disabled: dis }), 'Pull'), st0.behind, `Pull: ${st0.behind} commit${st0.behind > 1 ? 's' : ''} on ${st0.upstream || 'the remote'}`),
    counted(lbl(iconBtn('push', 'Push', (e) => pushMenu(e.currentTarget), { disabled: dis }), 'Push'), st0.ahead, `Push: ${st0.ahead} commit${st0.ahead > 1 ? 's' : ''} not on ${st0.upstream || 'the remote'} yet`),
    sep(),
    IN_TAB && lbl(iconBtn('stash', 'Stash changes', () => run('stashSave', { untracked: true }, { success: 'Stashed' }), { disabled: dis || !st0.files?.length }), 'Stash'),
    sep(),
    iconBtn('refresh', 'Refresh', () => manualRefresh(), { disabled: !state.repo }),
    iconBtn('undo', 'Undo the last action (commit, reset, merge, rebase…)', undoLast, { disabled: dis }),
    IN_TAB && iconBtn('search', 'Commands (Ctrl+K)', () => commandPalette(), { disabled: dis }),
    iconBtn('settings', 'Git settings (identity, HTTPS, remotes)', () => setTab('settings'), { disabled: !state.repo }),
    !IN_TAB && iconBtn('expand', 'Open Git Control in a full tab', openTab, { disabled: dis })
  ])
  const ops = { 'Fetch all (prune)': 'fetch', Pull: 'pull', Push: 'push', 'Stash changes': 'stash', Refresh: 'refresh', 'Undo the last action (commit, reset, merge, rebase…)': 'undo' }
  for (const b of tb.querySelectorAll('button')) if (ops[b.title]) b.dataset.op = ops[b.title]
  paintWorking()

  const bl = clear($('#branchLine'))
  if (!st) return
  append(bl, [
    h(
      'button',
      { class: 'branch-chip', title: 'Switch branch', onClick: (e) => quickSwitch(e.currentTarget) },
      icon('branch', 12),
      h('span', { class: 'ellipsis' }, st.branch || `detached @ ${(st.oid || '').slice(0, 7)}`),
      icon('down', 11)
    ),
    // ahead/behind live on the Pull and Push buttons; here only what they cannot say
    !st.upstream && st.branch && h('span', { class: 'sync', title: 'This branch has no remote branch yet: Push publishes it' }, 'not published'),
    ciBadge()
  ])
}

async function openTab() {
  setBusy(1)
  try {
    await request('tab.open', { repo: state.repo }, 20000)
  } catch (e) {
    toast(e.message, 'error')
  } finally {
    setBusy(-1)
  }
}

/** Refresh from the button or F5: the icon spins, then a short tick and what changed. */
async function manualRefresh() {
  if (working.has('refresh')) return
  const before = state.status ? state.status.oid + '|' + (state.status.files?.length || 0) + '|' + (state.status.ahead || 0) + '|' + (state.status.behind || 0) : ''
  setWorking('refresh', true)
  let ok = false
  try {
    await refreshAll(true)
    ok = true
  } finally {
    setWorking('refresh', false, ok)
  }
  const after = state.status ? state.status.oid + '|' + (state.status.files?.length || 0) + '|' + (state.status.ahead || 0) + '|' + (state.status.behind || 0) : ''
  if (ok) toast(after === before ? 'Refreshed · no changes' : 'Refreshed · updated', 'ok', 1800)
}

/* =========================================================================
   refresh
   ========================================================================= */
let refreshing = null
let pendingRefresh = null
let pendingFull = false
async function refreshAll(full = false) {
  if (refreshing) {
    // something changed since that refresh started (an operation finished, the repo switched): run once
    // more, as a full refresh if any of the callers queued behind it asked for one
    pendingFull ||= full
    pendingRefresh ||= refreshing.catch(() => {}).then(() => {
      const f = pendingFull
      pendingRefresh = null
      pendingFull = false
      return refreshAll(f)
    })
    return pendingRefresh
  }
  refreshing = (async () => {
    if (full || !state.repo) {
      const before = state.repo
      await resolveRepo()
      if (state.repo !== before && state.status) renderAll() // snapshot of the new repo: show it now
    }
    const repo = state.repo
    if (repo) {
      try {
        const [st, refs] = await Promise.all([call('status', full ? { fresh: true } : {}), call('refs').catch(() => state.refs)])
        if (repo !== state.repo) return // switched meanwhile: the queued refresh handles the new repo
        // any branch, tag or remote moving (our own push, fetch, commit…) redraws the graph's labels
        if (state.status && (st.oid !== state.status.oid || st.refsSig !== state.status.refsSig)) state.history.stale = true
        state.status = st
        state.refs = refs
        state.loadingRepo = false
      } catch (e) {
        if (repo !== state.repo) return
        state.status = null
        state.statusError = e.message
        state.loadingRepo = false
      }
    } else state.status = null
    if (full) state.history.stale = true // reload quietly instead of emptying the list
    if (full) state.ci = null // an explicit Refresh asks CI again too
    await renderAll()
    snap.save()
    loadCi()
  })()
  try {
    await refreshing
  } finally {
    refreshing = null
  }
}

async function renderAll() {
  renderHeader()
  renderBanner()
  renderTabs()
  if (IN_TAB) renderSide()
  await renderView()

/** Light status poll: only re-render when something changed. */
/** Is this tab on screen? Orca hides other projects' tabs, sometimes only by shrinking them to nothing. */
const isShown = () => document.visibilityState === 'visible' && window.innerWidth > 0 && window.innerHeight > 0
async function pollStatus(force) {
  if (!force && (!isShown() || !state.repo || state.busy || refreshing || document.querySelector('.overlay'))) return
  const repo = state.repo
  try {
    const st = await call('status')
    if (repo !== state.repo) return
    if (JSON.stringify(st) !== JSON.stringify(state.status)) {
      // HEAD moving, or any branch/tag/remote moving (an agent committing, a fetch), redraws the graph
      const headMoved = st.oid !== state.status?.oid || st.refsSig !== state.status?.refsSig
      let refs = state.refs
      if (headMoved) refs = await call('refs').catch(() => state.refs)
      if (repo !== state.repo) return // switched while the refs loaded
      state.status = st
      if (headMoved) {
        state.history.stale = true
        state.refs = refs
      }
      if (IN_TAB && headMoved) renderSide()
      renderHeader()
      renderBanner()
      renderTabs()
      if ((!state.sheets.length || force) && (state.tab === 'changes' || headMoved)) renderView()
    }
  } catch {}
}

/* =========================================================================
   view host + sheets
   ========================================================================= */
let lastTabRendered = null
let renderSeq = 0
// A form the person is typing into (Settings and the like) must not be redrawn under them by a
// background refresh. Typing marks it; switching tabs or saving (which re-renders by tab) clears it.
document.addEventListener('input', (e) => {
  if (e.target.closest?.('#main .form')) e.target.closest('.view')?.setAttribute('data-editing', '1')
})
async function renderView({ force = false } = {}) {
  const main = $('#main')
  if (!force && lastTabRendered === state.tab && main.querySelector('.view[data-editing]')) return
  const keepScroll = main.scrollTop
  const loading = main.querySelector('.loading')
  if (!state.repo) {
    clear(main).append(emptyRepo())
    return
  }
  if (state.loadingRepo) return showLoadingSkeleton()
  document.body.classList.remove('is-loading-repo')
  if (!state.status) {
    clear(main).append(
      h('div', { class: 'empty' }, icon('alert', 28), h('div', null, 'Not a Git repository'), h('div', { class: 'dim mono', style: { marginTop: '6px' } }, state.statusError || state.repo))
    )
    return
  }
  const views = { changes: viewChanges, history: viewHistory, branches: viewBranches, worktrees: viewWorktrees, stash: viewStash, reflog: viewReflog, reviews: viewReviews, settings: viewSettings }
  if (!views[state.tab]) state.tab = 'history'
  // Nothing on screen yet (first open, no snapshot): show placeholder rows instead of a blank area.
  if (!main.querySelector('.view')) {
    clear(main).append(h('div', { class: 'view skeleton-list' }, Array.from({ length: 14 }, (_, i) => h('div', { class: 'skeleton-row', style: { animationDelay: `${i * 40}ms` } }, h('span', { class: 'dot' }), h('span', { class: 'bar', style: { width: `${35 + ((i * 37) % 45)}%` } })))))
    if (loading) main.prepend(loading)
  }
  // Views load asynchronously; when renders overlap, only the newest may land. An older one
  // (built for another tab, scope or repository) would otherwise replace it.
  const seq = ++renderSeq
  let el
  try {
    el = await views[state.tab]()
  } catch (e) {
    el = h('div', { class: 'empty' }, icon('alert', 28), h('div', null, e.message))
  }
  if (seq !== renderSeq) return
  if (lastTabRendered !== state.tab) el.classList.add('view-enter')
  lastTabRendered = state.tab
  clear(main).append(el)
  if (loading) main.prepend(loading)
  if (state.sheets.length) placeSheet(state.sheets[state.sheets.length - 1].el)
  main.scrollTop = keepScroll
  applyViewRestore()
}
/** Once the remembered tab has its content: scroll back and reopen the commit that was open. */
function applyViewRestore() {
  const m = viewRestore
  if (!m) return
  const main = $('#main')
  if (state.tab === 'history' && !state.history.commits.length) return // wait for the list
  viewRestore = null
  if (m.scroll && (m.scrollTab || m.tab) === state.tab) main.scrollTop = m.scroll
  if (state.tab === 'history' && m.open && dockMode() && !state.sheets.length) {
    const c = state.history.commits.find((x) => x.hash === m.open)
    if (c) openDock(c)
  }
}

// A press outside the open sheet closes it (the merge request page, pipelines, diffs), like a modal.
// The docked commit details stay: the graph beside them is meant to be clicked while they are open.

document.addEventListener(

/* ---------- split view: on a wide graph the commit details dock to the right ---------- */
const dockMode = () => IN_TAB && state.tab === 'history' && window.innerWidth >= 1000
/** While the details are docked the graph makes room for them instead of sliding under. */

  if (!host) return

  if (d) host.style.setProperty('--dock-w', `${(d.el.isConnected ? d.el.getBoundingClientRect().width : 0) || store.get('sheetWidth', 0) || Math.min(560, host.clientWidth * 0.45)}px`)

/** Show a commit in the docked pane (opening it if needed); the list keeps its place. */
async function openDock(c) {

  H.open = c.hash
  viewMem.set({ open: c.hash })
  document.querySelectorAll('#main .commit-row.selected').forEach((r) => r.classList.remove('selected'))

  if (!top?.dock) {

/**
 * A sheet sits beside the scrolling area, not inside it, so it stays whole while the graph scrolls
 * behind it. It starts right under the tabs; its left edge drags to resize (remembered).
 */
function placeSheet(el) {
  const main = $('#main')
  const host = main.parentElement
  host.classList.add('sheet-host')
  el.style.top = `${main.offsetTop}px`
  // wide pages (merge request, pipelines, review diff) remember their own width, apart from the side sheets
  const wkey = el.classList.contains('wide-sheet') ? 'wideSheetWidth' : 'sheetWidth'
  const w = store.get(wkey, 0)
  el.style.width = w ? `${Math.min(w, host.clientWidth - 120)}px` : ''

    grip.addEventListener('pointerdown', (e) => {
      e.preventDefault()
      grip.setPointerCapture(e.pointerId)

      }
      grip.addEventListener('pointermove', move)

/* =========================================================================
   diff rendering
   ========================================================================= */
/** Split a unified diff into hunks, each a standalone patch (file header + one hunk). */
function splitHunks(text) {
  const hunks = []
  let header = []
  let cur = null
  for (const line of text.split('\n')) {
    if (line.startsWith('diff --git')) {
      header = [line]
      cur = null
    } else if (line.startsWith('@@')) {
      cur = { lines: [line], header: header.slice() }
      hunks.push(cur)
    } else if (cur) {
      if (line !== '') cur.lines.push(line)
    } else header.push(line)
  }
  return hunks.map((x) => [...x.header, ...x.lines].join('\n') + '\n')
}

/** Parse a unified diff into files → hunks → lines. */
function parseDiff(text) {
  const files = []
  let file = null
  let hunk = null
  let o = 0
  let n = 0
  let patch = -1
  const newFile = () => {
    file = { path: '', oldPath: '', badges: [], hunks: [], add: 0, del: 0, binary: false }
    files.push(file)
    hunk = null
  }
  for (const line of text.split('\n')) {
    if (line.startsWith('diff --git')) {
      newFile()
      const m = line.match(/^diff --git a\/(.*) b\/(.*)$/)
      if (m) [file.oldPath, file.path] = [m[1], m[2]]
    } else if (!file && (line.startsWith('--- ') || line.startsWith('@@'))) newFile()
    if (!file) continue
    if (line.startsWith('diff --git') || line.startsWith('index ')) continue
    if (line.startsWith('--- ')) {
      const p = line.slice(4).replace(/^a\//, '')
      if (p !== '/dev/null' && p !== 'NUL') file.oldPath = p
    } else if (line.startsWith('+++ ')) {
      const p = line.slice(4).replace(/^b\//, '')
      if (p !== '/dev/null' && p !== 'NUL') file.path = p
      else file.path = file.oldPath
    } else if (line.startsWith('new file')) file.badges.push('new')
    else if (line.startsWith('deleted file')) file.badges.push('deleted')
    else if (line.startsWith('rename from') || line.startsWith('similarity')) !file.badges.includes('renamed') && file.badges.push('renamed')
    else if (line.startsWith('Binary files')) file.binary = true
    else if (line.startsWith('@@')) {
      const m = line.match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@ ?(.*)$/)
      if (m) [o, n] = [+m[1], +m[3]]
      hunk = { oldStart: o, newStart: n, newCount: m ? +(m[4] ?? 1) : 0, oldCount: m ? +(m[2] ?? 1) : 0, context: m ? m[5] : line, lines: [], patch: ++patch }
      file.hunks.push(hunk)
    } else if (hunk && line.startsWith('+')) {
      hunk.lines.push({ k: 'add', n: n++, t: line.slice(1) })
      file.add++
    } else if (hunk && line.startsWith('-')) {
      hunk.lines.push({ k: 'del', o: o++, t: line.slice(1) })
      file.del++
    } else if (hunk && line.startsWith(' ')) hunk.lines.push({ k: 'ctx', o: o++, n: n++, t: line.slice(1) })
    else if (hunk && line.startsWith('\\')) hunk.lines.at(-1) && (hunk.lines.at(-1).noEol = true)
  }
  return files.filter((f) => f.hunks.length || f.binary || f.badges.length)
}

/** Text with the changed middle part marked, against its paired line (common prefix/suffix kept plain). */
function markChange(text, other) {
  if (other == null || text === other) return [text]
  let p = 0
  while (p < text.length && p < other.length && text[p] === other[p]) p++
  let q = 0
  while (q < text.length - p && q < other.length - p && text[text.length - 1 - q] === other[other.length - 1 - q]) q++
  const mid = text.slice(p, text.length - q)
  // a near-total rewrite reads better without marks
  if (!mid || mid.length > text.length * 0.85) return [text]
  return [text.slice(0, p), h('mark', null, mid), text.slice(text.length - q)]
}

/** Pair runs of removed and added lines, so each changed line can be shown against its counterpart. */
function pairLines(lines) {
  const out = []
  for (let i = 0; i < lines.length; ) {
    if (lines[i].k !== 'del') {
      out.push({ left: lines[i].k === 'ctx' ? lines[i] : null, right: lines[i] })
      i++
      continue
    }
    const dels = []
    while (i < lines.length && lines[i].k === 'del') dels.push(lines[i++])
    const adds = []
    while (i < lines.length && lines[i].k === 'add') adds.push(lines[i++])

/**
 * A readable diff: per file a header (+added −removed), hunks labelled by their lines, unified or
 * side by side (remembered), changed words marked, optional wrapping.
 * hunkActions: [{ label, icon, run(patch) }] on every hunk; onLine({ path, side, line, text }) makes lines clickable.
 */
function renderDiff(text, hunkActions, { onLine } = {}) {
  if (!text.trim()) return h('div', { class: 'empty' }, 'No changes to show (binary or identical file)')
  const files = parseDiff(text)
  const patches = hunkActions?.length ? splitHunks(text) : []
  const root = h('div', { class: 'dv' })
  const body = h('div')
  let mode = store.get('diffMode', 'unified')
  let wrapOn = store.get('diffWrap', false)
  const seg = h('div', { class: 'segmented' })
  const wrapBtn = h('button', { class: 'btn sm dv-wrap', title: 'Wrap long lines' }, icon('layers', 12), 'Wrap')
  const drawBar = () => {
    clear(seg).append(
      h('button', { class: mode === 'unified' ? 'on' : '', onClick: () => ((mode = 'unified'), store.set('diffMode', mode), draw()) }, 'Unified'),
      h('button', { class: mode === 'split' ? 'on' : '', onClick: () => ((mode = 'split'), store.set('diffMode', mode), draw()) }, 'Split')
    )
    wrapBtn.classList.toggle('on', wrapOn)
  }
  wrapBtn.addEventListener('click', () => ((wrapOn = !wrapOn), store.set('diffWrap', wrapOn), draw()))
  const total = files.reduce((t, f) => [t[0] + f.add, t[1] + f.del], [0, 0])
  root.append(
    h(
      'div',
      { class: 'dv-bar' },
      seg,
      wrapBtn,
      h('span', { class: 'grow' }),
      files.length > 1 && h('span', { class: 'dim' }, `${files.length} files`),
      files.length === 1 && !files[0].badges.includes('deleted') && h('button', { class: 'btn sm', title: `Open ${files[0].path} in the editor`, onClick: () => openRepoFile(files[0].path) }, icon('file', 12), 'Open file'),
      h('span', { class: 'dv-count' }, h('span', { class: 'a' }, `+${total[0]}`), h('span', { class: 'd' }, `−${total[1]}`))
    ),
    body
  )
  const cell = (ln, side, f) => {
    if (!ln) return [h('span', { class: 'n' }), h('span', { class: 'c empty-cell' })]
    return [h('span', { class: 'n' }, side === 'old' ? ln.o : ln.n), h('span', { class: 'c' }, ...(ln.mark || [ln.t]))]
  }
  const clickable = (el, f, ln, side) => {
    if (!onLine || !ln) return el
    el.classList.add('commentable')
    el.title = 'Click to comment on this line'
    el.addEventListener('click', () => onLine({ path: f.path, side, line: side === 'old' ? ln.o : ln.n, text: ln.t }))
    return el
  }
  // A huge file (a lockfile, generated code) shows its first lines; the rest on request.
  const MAX_LINES = 3000
  const expanded = new Set()
  function draw() {
    drawBar()
    root.classList.toggle('dv-wrapped', wrapOn)
    root.classList.toggle('dv-split', mode === 'split')
    const frag = document.createDocumentFragment()
    for (const f of files) {
      const showHead = files.length > 1 || !!onLine || f.badges.length > 0 // one plain file: the panel title names it
      const dir = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/') + 1) : ''
      if (showHead) frag.append(
        h(
          'div',
          { class: 'dv-file' },
          icon('file', 13),
          h('span', { class: 'dv-path link', title: `Open ${f.path} in the editor`, onClick: () => openRepoFile(f.path) }, dir && h('span', { class: 'dim' }, dir), h('strong', null, f.path.slice(dir.length))),
          ...f.badges.map((b) => h('span', { class: `pill dv-${b}` }, b)),
          f.badges.includes('renamed') && f.oldPath !== f.path && h('span', { class: 'dim mono' }, `from ${f.oldPath}`),
          h('span', { class: 'grow' }),
          h('span', { class: 'dv-count' }, h('span', { class: 'a' }, `+${f.add}`), h('span', { class: 'd' }, `−${f.del}`))
        )
      )
      if (f.binary) frag.append(h('div', { class: 'dv-note' }, 'Binary file: no text to compare'))
      const lineCount = f.hunks.reduce((t, hk) => t + hk.lines.length, 0)
      let budget = expanded.has(f) ? Infinity : MAX_LINES
      for (const hk of f.hunks) {
        if (budget <= 0) break
        const patch = patches[hk.patch]
        const last = hk.newStart + Math.max(0, hk.newCount - 1)
        frag.append(
          h(
            'div',
            { class: 'dv-hunk' },
            h('span', { class: 'dv-range' }, hk.newCount ? `Lines ${hk.newStart}${last > hk.newStart ? `–${last}` : ''}` : `Removed at line ${hk.oldStart}`),
            hk.context && h('span', { class: 'dv-ctx mono' }, hk.context),
            h('span', { class: 'grow' }),
            patch && hunkActions.map((a) => h('button', { class: `hunk-btn ${a.danger ? 'danger' : ''}`, title: `${a.label} this hunk`, onClick: () => a.run(patch) }, icon(a.icon, 11), a.label))
          )
        )
        const lines = hk.lines.length > budget ? hk.lines.slice(0, budget) : hk.lines
        budget -= lines.length
        const pairs = pairLines(lines)
        for (const pr of pairs) {
          if (pr.changed && pr.left && pr.right) {
            pr.left.mark = markChange(pr.left.t, pr.right.t)
            pr.right.mark = markChange(pr.right.t, pr.left.t)
          }
        }
        if (mode === 'split') {
          for (const pr of pairs) {
            const lk = pr.left ? pr.left.k : 'none'
            const rk = pr.right ? (pr.right.k === 'ctx' && pr.left ? 'ctx' : pr.right.k) : 'none'
            frag.append(
              h(
                'div',
                { class: 'ds' },
                clickable(h('div', { class: `ds-side ${lk}` }, ...cell(pr.left, 'old', f)), f, pr.left, 'old'),
                clickable(h('div', { class: `ds-side ${rk}` }, ...cell(pr.right, 'new', f)), f, pr.right, 'new')
              )
            )
          }
        } else {
          for (const ln of lines) {
            const side = ln.k === 'del' ? 'old' : 'new'
            frag.append(
              clickable(
                h('div', { class: `l ${ln.k}` }, h('span', { class: 'n' }, ln.k === 'add' ? '' : ln.o), h('span', { class: 'n' }, ln.k === 'del' ? '' : ln.n), h('span', { class: 'sg' }, ln.k === 'add' ? '+' : ln.k === 'del' ? '−' : ''), h('span', { class: 'c' }, ...(ln.mark || [ln.t]))),
                f,
                ln,
                side
              )
            )
          }
        }
      }
      if (!expanded.has(f) && lineCount > MAX_LINES)
        frag.append(
          h(
            'div',
            { class: 'dv-note dv-more' },
            `Showing the first ${MAX_LINES} of ${lineCount} lines. `,
            h('button', { class: 'btn sm', onClick: () => (expanded.add(f), draw()) }, `Show all ${lineCount} lines`)
          )
        )
    }
    clear(body).append(frag)
  }
  draw()
  return root
}

/**
 * Lay out commits as lanes, the way Git Extensions draws its graph:
 * - a branch keeps one colour from top to bottom;
 * - when a commit's parent is already on screen, its line joins that lane instead of opening a new one;
 * - gaps close by sliding lanes left, so the graph stays narrow.
 * Each row lists the line segments to draw: [fromLane, fromY, toLane, toY, colour].

  let lanes = [] // [{ h: hash this lane is waiting for, c: colour index }]
  let nextColor = 0
  const rows = []
  for (const c of commits) {
    const top = lanes
    let col = top.findIndex((l) => l.h === c.hash)
    const hadTop = col !== -1
    const work = top.slice()
    if (!hadTop) {
      col = work.length
      work.push({ h: c.hash, c: nextColor++ })
    }
    const color = work[col].c
    const edges = []
    const merging = []
    top.forEach((l, i) => {
      if (i !== col && l.h === c.hash) merging.push(i)

    if (hadTop) edges.push([col, 0, col, 'mid', color])
    for (const i of merging) edges.push([i, 0, col, 'mid', top[i].c])
    for (const i of merging) work[i] = null

    // parents
    const targets = [] // [laneIndexInWork, colour]
    if (c.parents.length) {
      const p0 = c.parents[0]
      const k = work.findIndex((l, i) => l && i !== col && l.h === p0)
      if (k !== -1) {

      } else {
        work[col] = { h: p0, c: color }

      for (const p of c.parents.slice(1)) {
        let j = work.findIndex((l) => l && l.h === p)

          j = work.length
          work.push({ h: p, c: nextColor++ })

        targets.push([j, work[j].c])

    } else work[col] = null

    // compact: lanes slide left over the gaps
    const newIdx = []
    const next = []
    work.forEach((l, i) => {
      if (l) {

function refPills(refs, lane) {

  }
  const pill = (cls, iconName, text, title) => lanePill(h('span', { class: `ref ${cls}`, title }, icon(iconName, 10), h('span', { class: 'ref-t' }, text)))
